plugins {
    id 'com.android.application' version '8.13.2'
}
android {
    namespace 'local.shelf.player'
    compileSdk 36

    defaultConfig {
        applicationId providers.gradleProperty('shelfApplicationId').getOrElse('local.shelf.player')
        minSdk 34
        targetSdk 34
        versionCode 7
        versionName '0.4.3'
        testInstrumentationRunner 'local.shelf.player.ShelfInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging.resources.excludes += ['META-INF/INDEX.LIST', 'META-INF/DEPENDENCIES']
}
dependencies {
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'androidx.media3:media3-exoplayer:1.11.1'
    implementation 'androidx.media3:media3-ui:1.11.1'
    implementation 'com.hierynomus:smbj:0.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
